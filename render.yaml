services:
  - type: web
    name: asset-management
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false          # you paste this in the Render dashboard, never in git
      - key: MONGODB_DB_NAME
        value: asset_management
      - key: JWT_SECRET
        generateValue: true  # Render generates a random secret; never stored in the repo
