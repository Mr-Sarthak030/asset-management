<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title> IT ASSIST — Asset Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            accent: 'rgb(var(--accent) / <alpha-value>)',
            'accent-deep': 'rgb(var(--accent-deep) / <alpha-value>)',
            'accent-soft': 'rgb(var(--accent-soft) / <alpha-value>)',
          },
        },
      },
    };
  </script>
  <style>
    /* Admin-selectable themes. JS sets data-theme on <html>. */
    :root, [data-theme="indigo"] {
      --accent: 79 70 229;        /* indigo-600 */
      --accent-deep: 55 48 163;   /* indigo-800 */
      --accent-soft: 238 242 255; /* indigo-50 */
    }
    [data-theme="slate"] {
      --accent: 51 65 85;         /* slate-700 */
      --accent-deep: 15 23 42;    /* slate-900 */
      --accent-soft: 241 245 249; /* slate-100 */
    }
    [data-theme="emerald"] {
      --accent: 5 150 105;        /* emerald-600 */
      --accent-deep: 6 78 59;     /* emerald-900 */
      --accent-soft: 236 253 245; /* emerald-50 */
    }
    html { -webkit-tap-highlight-color: transparent; }
    body { font-feature-settings: "tnum"; }
    /* Smooth momentum scrolling for swipe-friendly tables on touch devices */
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    /* Respect the device notch / home bar on phones */
    .safe-bottom { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    .fade-in { animation: fadeIn .18s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased min-h-screen">
  <div id="app"></div>
  <div id="toast-root" class="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-[70] w-[calc(100%-2rem)] max-w-sm space-y-2"></div>
  <div id="modal-root"></div>
  <script src="/app.js"></script>
</body>
</html>
